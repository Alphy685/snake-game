<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Snake Game in JavaScript
        const TILE_SIZE = 25;
        const GAME_WIDTH = 600;
        const GAME_HEIGHT = 600;

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = GAME_WIDTH;
        canvas.height = GAME_HEIGHT;
        document.body.appendChild(canvas);

        document.body.style.display = "flex";
        document.body.style.justifyContent = "center";
        document.body.style.alignItems = "center";
        document.body.style.height = "100vh";
        document.body.style.backgroundColor = "black";

        let x = [50, 25, 0];
        let y = [50, 50, 50];
        let snakeLength = 3;
        let foodX, foodY;
        let direction = 'R';
        let running = false;

        function spawnFood() {
            foodX = Math.floor(Math.random() * (GAME_WIDTH / TILE_SIZE)) * TILE_SIZE;
            foodY = Math.floor(Math.random() * (GAME_HEIGHT / TILE_SIZE)) * TILE_SIZE;
        }

        function startGame() {
            snakeLength = 3;
            x = [50, 25, 0];
            y = [50, 50, 50];
            direction = 'R';
            running = true;
            spawnFood();
            gameLoop();
        }

        function move() {
            for (let i = snakeLength; i > 0; i--) {
                x[i] = x[i - 1];
                y[i] = y[i - 1];
            }

            switch (direction) {
                case 'L':
                    x[0] -= TILE_SIZE;
                    break;
                case 'R':
                    x[0] += TILE_SIZE;
                    break;
                case 'U':
                    y[0] -= TILE_SIZE;
                    break;
                case 'D':
                    y[0] += TILE_SIZE;
                    break;
            }
        }

        function checkFood() {
            if (x[0] === foodX && y[0] === foodY) {
                snakeLength++;
                spawnFood();
            }
        }

        function checkCollisions() {
            for (let i = snakeLength; i > 0; i--) {
                if (x[0] === x[i] && y[0] === y[i]) {
                    running = false;
                }
            }

            if (x[0] < 0 || x[0] >= GAME_WIDTH || y[0] < 0 || y[0] >= GAME_HEIGHT) {
                running = false;
            }
        }

        function draw() {
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

            if (running) {
                ctx.fillStyle = "red";
                ctx.fillRect(foodX, foodY, TILE_SIZE, TILE_SIZE);

                for (let i = 0; i < snakeLength; i++) {
                    ctx.fillStyle = i === 0 ? "green" : "yellow";
                    ctx.fillRect(x[i], y[i], TILE_SIZE, TILE_SIZE);
                }
            } else {
                ctx.fillStyle = "red";
                ctx.font = "40px Arial";
                ctx.textAlign = "center";
                ctx.fillText("Game Over", GAME_WIDTH / 2, GAME_HEIGHT / 2);
            }
        }

        function gameLoop() {
            if (running) {
                move();
                checkFood();
                checkCollisions();
            }
            draw();
            if (running) {
                setTimeout(gameLoop, 100);
            }
        }

        window.addEventListener("keydown", (e) => {
            switch (e.key) {
                case "ArrowLeft":
                    if (direction !== 'R') direction = 'L';
                    break;
                case "ArrowRight":
                    if (direction !== 'L') direction = 'R';
                    break;
                case "ArrowUp":
                    if (direction !== 'D') direction = 'U';
                    break;
                case "ArrowDown":
                    if (direction !== 'U') direction = 'D';
                    break;
            }
        });

        startGame();

    </script>
</body>
</html>
